<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <style>

      html, body {

	  margin : 0;
	  padding: 0;
	  border: none;
	  width: 100%;
	  height: 100%;
      }
      
    </style>
    
    <script src="../js/exa_api.js"></script>

  </head>

<body>

  <script type="module">

    import { makeSvgProcessor } from '../js/svg-processor.js';
    import { makeDomProcessor } from '../js/dom-processor.js';

    console.log("Starting wex 0.4.0 ...");

    //console.log = function() {};

    const pid = parseInt(window.frameElement.getAttribute('pid'));

    var memory;

    const WS_URL = "wss://vps-04ec407a.vps.ovh.net:443/ws2";

    var windowId = null;
    var socket;

    var writeEventToRing;

    function do_connect(window_id, callback) {

	console.log("[wex] Connecting:", WS_URL);

	try {
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
		
		console.log("[wex] Connected");
		
		const handshake = {
                    type: "connect",
                    client_type: "window",
                    window_id: window_id
		};
		
		socket.send(JSON.stringify(handshake));
            };

            socket.onmessage = (event) => {
		
		let message;

		try {
		    
		    message = JSON.parse(event.data);

		    if ((message.type === "connected") && (message.client_type === "window")) {

			windowId = window_id;

			callback();
		    }
		    else if ((message.type === "event") && (message.client_type === "window")) {

			//console.log("[wex]: Event received");
			//console.log(message.event);
			
			writeEventToRing(message.event); // .replace(/,/g, "\\t").replace(/;/g, "\\n")
		    }
		    
		} catch (error) {
		    
		    console.error("Error :", error);

                    if (error instanceof Error) {
			console.error("Message :", error.message);
			console.error("Stack :", error.stack);
                    }
		    return;
		}

		console.log(
		    "[wex] Received:",
		    message
		);	
            };

            socket.onerror = (error) => {
		console.error(
		    "[wex] WebSocket error",
		    error
		);
            };

            socket.onclose = () => {
		console.log("[wex] Disconnected");
            };

	} catch (error) {
	    
            console.error(
		"[wex] Connection failed",
		error
            );
	}
    }

    function write_error(error, callback) {

	exa.IsOpen(2).then(function([remote_fd, peer]) {

	    exa.write(remote_fd, peer, error).then(function(bytes_written) {

		if (callback) {

		    callback();
		}
		else {
		    exa.exit(-1);
		}
		
	    }, function() {

		if (callback) {

		    callback();
		}
		else {
		    exa.exit(-1);
		}
	    });
	    
	}, function() {

	    if (callback) {

		callback();
	    }
	    else {
		exa.exit(-1);
	    }
	});
    }

    function print_help() {

	const help = `Usage: wex [options] filename

  WebAssembly WASI runtime (0.1 & 0.2) with WASIX extension (starting)

options:
  -d, --dir <HOST_DIR[::GUEST_DIR]>            Grant access of a host directory to a guest.
  -w, --window <WINDOW_ID>                     Redirect display a remote window
  -h, --help                                   Print this help message.
  -v, --version                                Print version information.
  -t, --trace                                  Print syscalls.\n`;

	write_error(help, () => { exa.exit(0); });

    }

    function print_version() {

	const version = "wex 0.4.0\n";
	
	write_error(version, () => { exa.exit(0); });
    }

    function parse_args(args) {

	let input = "";
	let trace = false;
	let info = false;
	let dir_expected = false;
        let directories = "";
        let window_id = null;
        let window_id_expected = false;

	let i = 0;

	for (let arg of args.slice(1)) {

	    i++;

	    if (dir_expected) {

		if (arg.indexOf("-") == 0) {

		    write_error("Directory expected\n", () => { print_help() });
		    return [ null ];
		}
		else {
		    
		    if (directories.length > 0) {

			directories += "|";
		    }

		    directories += arg;
		    
		    dir_expected = false;
		}
	    }
	    else if (window_id_expected) {

		if (arg.indexOf("-") == 0) {

		    write_error("Window id expected\n", () => { print_help() });
		    return [ null ];
		}
		else {
		    
		    window_id = arg;
		    window_id_expected = false;
		}
	    }
	    else if ( (arg === "--dir") || (arg === "-d") ) {

		dir_expected = true;
	    }
	    else if ( (arg === "--window") || (arg === "-w") ) {

		window_id_expected = true;
	    }
	    else if ( (arg === "--help") || (arg === "-h") ) {

		print_help();
		return [ null ];
	    }
	    else if ( (arg === "--version") || (arg === "-v") ) {

		print_version();
		return [ null ];
	    }
	    else if ( (arg === "--trace") || (arg === "-t") ) {

		trace = true;
	    }
	    else if ( (arg === "--info") || (arg === "-i") ) {

		info = true;
	    }
	    else if (arg.indexOf("-") == 0) {

		write_error("Unknown option '"+arg+"'\n", () => { print_help() });
		return [ null ];
	    }
	    else if (input === "") {

		input = arg;
		break;
	    }
	}

	if (input === "") {

	    print_help();
	    return [ null ];
	}

	return [input, i, trace, info, directories, window_id];
    }

    function get_string(path, len) {

	let td = new TextDecoder("utf-8");

	if (memory.buffer instanceof SharedArrayBuffer) {

	    const view = new Uint8Array(memory.buffer, path, len);
	    const copy = view.slice();
	    
	    return td.decode(copy);
	}
	else {
	    
	    return td.decode(HEAPU8.subarray(path, path+len));
	}
    }

    function uint8ToBase64(bytes) {
	let binary = "";

	const chunkSize = 0x8000;

	for (let i = 0; i < bytes.length; i += chunkSize) {
            const chunk = bytes.subarray(i, i + chunkSize);
            binary += String.fromCharCode(...chunk);
	}

	return btoa(binary);
    }

    function start_worker(wasm, input_pos, trace, info, directories) {

	const sharedEventBuffer = new SharedArrayBuffer(4);
	const sharedEventArray = new Int32Array(sharedEventBuffer);

	const sharedDataBuffer = new SharedArrayBuffer(1024*1024);
	const sharedDataArray = new Uint8Array(sharedDataBuffer);
	
	sharedEventArray[0] = 0;

	const rcv_bc = new BroadcastChannel("channel.process."+pid);

	rcv_bc.onmessage = function(event) {

	    console.log("Main: rcv_bc msg");
	    
	    console.log(event.data.buf[0]);
	    console.log(event.data.buf.length);

	    if (sharedEventArray[0] == 0) {

		sharedDataArray.set(event.data.buf);

		Atomics.store(sharedEventArray, 0, event.data.buf[0]);
		Atomics.notify(sharedEventArray, 0);
	    }
	};

	var timers = {};
	
	var select_timer;

	var svg_processor;
	var dom_processor;
	var dom_select;

	/*const bc = new BroadcastChannel("bc");

	  bc.onmessage = function(event) {

	  //console.log("Main: bc msg");
	  console.log(event.data);

	  setTimeout(() => {

	  Atomics.store(sharedEventArray, 0, 1);
	  Atomics.notify(sharedEventArray, 0);
	  
	  }, 100);
	  };*/
	

	const worker = new Worker('../js/wasmWorker.js');

	worker.addEventListener('message', message => {
	    
	    console.log('message', message);
	    console.log(message.data);

	    if (message.data.op == 'subscribe_duration') {

		timers[message.data.fd] = message.data;

		message.data.elapsed = false;
		message.data.polled = false;

		setTimeout((function(_timer) {

		    return function () {

			console.log("timer elapsed");
			console.log(_timer);

			_timer.elapsed = true;

			if (_timer.polled) {

			    console.log("timer polled "+_timer.fd);

			    Atomics.store(sharedEventArray, 0, _timer.fd);
			    Atomics.notify(sharedEventArray, 0);
			}

		    };

		})(message.data), message.data.duration);
		
	    }
	    else if (message.data.op == 'poll') {

		for (let _fd of message.data.fds) {

		    if ('timeout' in _fd) {

			console.log("poll with timeout: duration="+_fd.timeout);

			if (_fd.timeout > 2147483647) {
			    _fd.timeout = 2147483647;
			}

			setTimeout(function () {

			    console.log("poll timeout");

			    Atomics.store(sharedEventArray, 0, -1);
			    Atomics.notify(sharedEventArray, 0);
			    
			}, _fd.timeout);
		    }
		    else if ( (_fd.fd in timers) && timers[_fd.fd].elapsed) {

			console.log("timer already elapsed");
			
			Atomics.store(sharedEventArray, 0, _fd.fd);
			Atomics.notify(sharedEventArray, 0);

			break;
		    }
		    else {

			timers[_fd.fd].polled = true;
		    }
		}
	    }
	    else if (message.data.op == 'select_timer') {

		console.log("select_timer: dur="+message.data.duration);

		if (message.data.duration >= 0) {

		    if (message.data.duration > 2147483647) {
			message.data.duration = 2147483647;
		    }

		    select_timer = setTimeout(function () {
			
			const fd = -1;

			sharedDataArray[0] = 31|128;

			sharedDataArray[12] = fd & 0xff;
			sharedDataArray[13] = (fd >> 8) & 0xff;
			sharedDataArray[14] = (fd >> 16) & 0xff;
			sharedDataArray[15] = (fd >> 24) & 0xff;

			Atomics.store(sharedEventArray, 0, 31|128); // Return select
			Atomics.notify(sharedEventArray, 0);
			

		    }, message.data.duration);
		}
		else if (select_timer) {

		    clearTimeout(select_timer);
		    select_timer = null;
		}
            }
            else if ( (message.data.op == 'open_svg') || (message.data.op == 'open_dom') ) {

		memory = message.data.mem;

		if (windowId) {

		    if (message.data.op == 'open_dom') {

			let dummy;
			
			[ dummy, dom_select, writeEventToRing ] = makeDomProcessor(null, message.data.sab, () => { return memory; });

			console.log("open_dom !!!");
			console.log(writeEventToRing);
		    }

		    Atomics.store(sharedEventArray, 0, 255);
		    Atomics.notify(sharedEventArray, 0);

		    return;
		}

              exa.show();

              const top = document.createElement("div");

              top.style.width = "fit-content";
		top.style.height = "fit-content";
		top.style.position = "absolute";
		top.style.top = "0px";
		top.style.left = "0px";
		
		

              const deco = document.createElement("div");
              deco.id = "deco";
      
		top.appendChild(deco);

		deco.addEventListener("mousedown", (event) => {

		    console.log("Decoration mouse down: "+event.target.id);

		    if (event.target.id == 'close') {

			exa.exit(0);
		      
		    event.stopPropagation();
		  }
	          else if (event.target.id == 'max') {

		    event.stopPropagation();
		  }
		  else if (event.target.id == 'min') {

		    let m = new Object();
	
		    m.type = 12; // minimize
		    m.pid = pid & 0x0000ffff;
		    
		    window.parent.postMessage(m);
		
		    event.stopPropagation();
		  }
		  else if (event.target.id == 'axel') {

		    let m = new Object();
	
		    m.type = 14; // axel
		    m.pid = pid & 0x0000ffff;
		    
		    window.parent.postMessage(m);
		
		    event.stopPropagation();
		  }
		  else {
		  
		    if (!window.selected_toplevel) {

			console.log("Select toplevel");
			

		      window.selected_toplevel = top;
		
		      window.selected_x = event.clientX;
		      window.selected_y = event.clientY;
		      window.start_x = parseInt(window.selected_toplevel.style.left);
			window.start_y = parseInt(window.selected_toplevel.style.top);

			console.log(window.selected_toplevel.style.left);
		    }
		    
		    const svg = window.selected_toplevel.getElementsByTagName("svg")[0];

		    if (svg) {
		      svg.focus();
		    }

		    event.stopPropagation();
		    event.preventDefault();
		    
		  }
	      
		}, false);

	  top.addEventListener("mousedown", (event) => {

	      //console.log("Window mouse down");
	      //console.log(event);
		
	      event.stopPropagation();
	      
	  }, false);

	document.body.addEventListener("mousemove", (event) => {

	    console.log("Body mouse move");
	    console.log(window.selected_toplevel);

	      if (window.selected_toplevel) {

		window.selected_toplevel.style.left = (window.start_x+event.clientX-window.selected_x)+"px";
		window.selected_toplevel.style.top = (window.start_y+event.clientY-window.selected_y)+"px";
	      }
	      
	    }, false);

	  document.body.addEventListener("mousedown", (event) => {

	      console.log("Body mouse down: click outside window !");
	      //console.log(event);

	      let m = new Object();
	
	      m.type = 8; // mouse down
	      m.pid = pid & 0x0000ffff;
	      m.x = event.clientX;
	      m.y = event.clientY;

	      window.parent.postMessage(m);
	      
	      }, false);

	  document.body.addEventListener("mouseup", (event) => {

	      //console.log("Body mouse up");

	      window.selected_toplevel = null;
	      
	  }, false);

		if (message.data.op == 'open_svg') {

		const SVG_NS  = 'http://www.w3.org/2000/svg';
      
		const svg = document.createElementNS(SVG_NS, 'svg');
		
		svg.id = "__root";
    
		/*svg.setAttribute('width', String(width));
		svg.setAttribute('height', String(height));
		svg.setAttribute('viewBox', viewBox || `0 0 ${width} ${height}`);*/
		
		svg.setAttribute('xmlns', SVG_NS);
		
		svg.style.backgroundColor = "#000000";
		svg.style.display = "block";

		const defs = document.createElementNS(SVG_NS, 'defs');
		
		svg.insertBefore(defs, svg.firstChild);

		    top.appendChild(svg);

		    svg_processor = makeSvgProcessor(svg, defs);
		    
		}
		else if (message.data.op == 'open_dom') {

		    const div = document.createElement('div');
		
		    div.id = "__root";
		    
		    top.appendChild(div);

		    [ dom_processor, dom_select, writeEventToRing ] = makeDomProcessor(div, message.data.sab, () => { return memory; });
		}
              
	      document.body.appendChild(top);
		
		loadDeco(function() {

		   Atomics.store(sharedEventArray, 0, 255);
		   Atomics.notify(sharedEventArray, 0);
		});
            }
            else if (message.data.op == 'show_svg') {

		const arr = message.data.arr;

		let cmd = '';

		for (let i = 0; i < arr.length; i++) {
		    
		    const chunk = get_string(arr[i][0], arr[i][1]);
	    
		    cmd += chunk;
		}
		
		//console.log(cmd);

		// Process complete lines
		let nl;
		
		while ((nl = cmd.indexOf('\n')) !== -1) {
		    const line = cmd.slice(0, nl);
		    cmd = cmd.slice(nl + 1);
		    svg_processor(line);
		}

		Atomics.store(sharedEventArray, 0, 255);
		Atomics.notify(sharedEventArray, 0);
            }
	    else if (message.data.op == 'show_dom') {

		const arr = message.data.arr;

		let cmd = '';

		for (let i = 0; i < arr.length; i++) {
		    
		    const chunk = get_string(arr[i][0], arr[i][1]);
	    
		    cmd += chunk;
		}
		
		//console.log(cmd);

		if (windowId) {

		    const full_cmd = cmd;
		    
		    // Process blob and css-raw lines
		    let nl;
		    
		    while ((nl = cmd.indexOf('\n')) !== -1) {
			let line = cmd.slice(0, nl);
			cmd = cmd.slice(nl + 1);
			
			line = line.trim();
			if (!line) continue;
			
			// ── Directives: <!...> ────────────────────────────────────────────────
			if (line.startsWith('<!')) {
			    const inner = line.slice(2, -1).trim();
			    
			    if (inner.startsWith('blob ')) {
				// <!blob BLOB-ID PTR LEN MIME>
				const rest = inner.slice(5);
				const sp1  = rest.indexOf(' ');
				if (sp1 === -1) continue;
				const blobId = rest.slice(0, sp1);
				const rest2  = rest.slice(sp1 + 1);
				const sp2    = rest2.indexOf(' ');
				if (sp2 === -1) continue;
				const ptr   = parseInt(rest2.slice(0, sp2), 10);
				const rest3 = rest2.slice(sp2 + 1);
				const sp3   = rest3.indexOf(' ');
				if (sp3 === -1) continue;
				const len  = parseInt(rest3.slice(0, sp3), 10);
				const mime = rest3.slice(sp3 + 1);
				const mem  = memory;
				if (!mem) { console.warn(`dom-blob: memory not available for blob '${blobId}'`); return; }

				const bytes = new Uint8Array(len);
				bytes.set(new Uint8Array(mem.buffer, ptr, len));
				const base64 = uint8ToBase64(bytes);
				
				const msg = {
				    type: "show_dom",
				    cmd: "<!blob>",
				    mime: mime,
				    blob_id: blobId,
				    data: base64,
				    window_id: windowId
				};
				
				socket.send(JSON.stringify(msg));
			    }
			    else if (inner.startsWith('css-raw ')) {

				const parts = inner.slice(8).split(' ');
				
				if (parts.length === 2) {
				    const ptr  = parseInt(parts[0], 10);
				    const len  = parseInt(parts[1], 10);
				    const mem  = memory;
				    const copy = new Uint8Array(len);
				    copy.set(new Uint8Array(mem.buffer, ptr, len));
				    const css = new TextDecoder().decode(copy);

				    const msg = {
					type: "show_dom",
					cmd: "<!css-raw>",
					css: css,
					window_id: windowId
				    };
				    
				    socket.send(JSON.stringify(msg));
				    
				}
			    }
			}
		    }

		    const msg = {
			type: "show_dom",
			cmd: full_cmd,
			window_id: windowId
		    };
		    
		    socket.send(JSON.stringify(msg));
		}
		else {
		    // Process complete lines
		    let nl;
		    
		    while ((nl = cmd.indexOf('\n')) !== -1) {
			const line = cmd.slice(0, nl);
			cmd = cmd.slice(nl + 1);
			dom_processor(line);
		    }
		}

		Atomics.store(sharedEventArray, 0, 255);
		Atomics.notify(sharedEventArray, 0);
            }
	    else if (message.data.op == 'select_dom') {

		console.log("!!! select_dom: start="+message.data.start);

		if (message.data.start) {
		    
		    dom_select(sharedEventArray, sharedDataArray);
		}
		else {
		    
		    dom_select(null, null);
		}
	    }
	    
	});

	let args = exa.args.slice(input_pos).join(" ");

	args += " "; // finish by space

	worker.postMessage({pid: pid, eventBuf: sharedEventBuffer, dataBuf: sharedDataBuffer, file: wasm, args: args, env_count: exa.env_count, env_size: exa.env_size, env: exa.env, trace: trace, info: info, directories: directories});
	
    }

      function loadDeco(callback) {

      let deco = document.getElementById("deco");

      const request = new Request("/netfs/etc/xdg/system/deco.html");

      fetch(request)
      .then((response) => response.text())
      .then((text) => {

      deco.innerHTML += text.replace("[TITLE]", "SVG");

      callback();
      });
      }
      
    exa.init();

    exa.args_env().then(function() {

	console.log(exa.args);

	const [path, pos, trace, info, directories, window_id] = parse_args(exa.args);

	if (path) {

	    exa.open(path, 0 /* O_RDONLY */, 0).then(function([fd, remote_fd, peer]) {

		console.log("file opened successfully");

		exa.read(remote_fd, peer).then(function(buffer) {

		    console.log("File read: "+buffer.length+" bytes");

		    exa.close(fd).then(function() {

		    if (window_id) {

		        do_connect(window_id, () => {

			    start_worker(buffer, pos, trace, info, directories);
		        });
		    }
		    else {
		        
		        start_worker(buffer, pos, trace, info, directories);
		    }
			
		    }, function() {

			
		    });

		}, function() {

		    console.log("Unable to read file");

		    exa.close(fd).then(function() {

		    }, function() {

		    });
		});
		
	    }, function() {

		write_error("File '"+path+"' not found\n");
	    });
	}

    });
    
  </script>
  </body>
